["*cls"]
description = "Clear all the SCPI exposed registers on the device."
warning = "This does not perform a reset of the device. Hence, statuses may be retained."
args = {}
returns = { "STATUS" = "int<0...>" }
duration = "very fast"
blocking = true
ex_command = "`*CLS`"
ex_return = "`0`"

["*ese"]
description = "Set bits on the Event Status Register. Returns the event status mask."
args = { "XX" = "Bits to be set (if maskable)." }
returns = { "STATUS" = "int<0...>", "MASK" = "int<-1-255>" }
duration = "very fast"
blocking = true
ex_command = "`*ESE 255`"
ex_return = "`0,255`"
table = { name = "Bit signification", array = [
    [
        "Bit",
        "Name",
        "Signification",
    ],
    [
        "0",
        "OPC",
        "Operation complete",
    ],
    [
        "1",
        "",
        "Unused",
    ],
    [
        "2",
        "QYE",
        "The device could not process a command. Buffers are perhaps full ?",
    ],
    [
        "3",
        "DDE",
        "Self test failed",
    ],
    [
        "4",
        "EXE",
        "A command failed it's execution",
    ],
    [
        "5",
        "CMD",
        "An invalid command was received",
    ],
    [
        "6",
        "",
        "Unused",
    ],
    [
        "7",
        "",
        "Unused",
    ],
] }


["*esr"]
description = "Read bits on the Event Status Register. Returns the event status mask."
returns = { "STATUS" = "int<0...>", "VALUE" = "int<0-255>" }
duration = "very fast"
blocking = true
ex_command = "`*ESR?`"
ex_return = "`0,25`"
table = { name = "Bit signification", array = [
    [
        "Bit",
        "Name",
        "Signification",
    ],
    [
        "0",
        "OPC",
        "Operation complete",
    ],
    [
        "1",
        "",
        "Unused",
    ],
    [
        "2",
        "QYE",
        "The device could not process a command. Buffers are perhaps full ?",
    ],
    [
        "3",
        "DDE",
        "Self test failed",
    ],
    [
        "4",
        "EXE",
        "A command failed it's execution",
    ],
    [
        "5",
        "CMD",
        "An invalid command was received",
    ],
    [
        "6",
        "",
        "Unused",
    ],
    [
        "7",
        "",
        "Unused",
    ],
] }


["*idn"]
description = "Return the identification string for the device."
args = {}
returns = { "STATUS" = "int<0...>", "IDN" = "<string>" }
duration = "very fast"
blocking = true
ex_command = "`*IDN?`"
ex_return = "`0,EtherBenchv1:[build-date]:[firmware-version]`"


["*opc"]
description = "Check for current running commands"
args = { "XX" = "Value" }
returns = { "STATUS" = "int<0...>" }
duration = "very fast"
blocking = true
ex_command = "`*OPC?`"
ex_return = "`0,OK`"


["*opt"]
description = "Returns the options string of the device."
info = "No options are possible for now."
args = {}
returns = { "STATUS" = "int<0...>" }
duration = "very fast"
blocking = true
ex_command = "`*OPT?`"
ex_return = "`0,EtherBenchv1:[]`"

["*rst"]
description = "Reset the device, equivalent to a power on-off-on cycle."
warning = "Perform an hard reset of the device. Any openned sessions will be *brutally* closed."
args = {}
returns = { "STATUS" = "int<0...>" }
duration = "slow"
blocking = true
ex_command = "`*RST`"
ex_return = "`0`"

["*sre"]
description = "Return the service query status."
note = "This command is implented as a placeholder. Always return false."
args = {}
returns = { "STATUS" = "int<0...>" }
duration = "very fast"
blocking = true
ex_command = "`*SRE?`"
ex_return = "`0`"

["*stb"]
description = "Read the status byte register"
note = "This command is implented as a placeholder. Always return 0."
args = {}
returns = { "STATUS" = "int<0...>" }
duration = "very fast"
blocking = true
ex_command = "`*STD?`"
ex_return = "`0`"

["*tst"]
description = "Perform the self-test of the device. Check that all threads are running."
args = {}
returns = { "STATUS" = "int<0...>" }
duration = "very fast"
blocking = true
ex_command = "`*TST?`"
ex_return = "`0`"

["*wai"]
description = "Wait for all operations to be executed."
args = {}
returns = { "STATUS" = "int<0...>" }
duration = "slow"
blocking = true
ex_command = "`*WAI`"
ex_return = "`0`"
