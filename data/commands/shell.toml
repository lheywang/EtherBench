["cat"]
description = "Show a file from the filesystem into the current terminal"
args = { "file" = "str" }
returns = { "CAT" = "str" }
duration = "normal"
blocking = true
ex_command = "`cat /sd/hello.txt`"
ex_return = "`Hello World !`"

["cd"]
description = "Change the current directory"
args = { "target" = "str" }
returns = { "CD" = "OK" }
duration = "fast"
blocking = true
ex_command = "`cd /sd`"
ex_return = "`*CD,OK`"

["clear"]
description = "Clear the current terminal"
args = {}
returns = { "RST" = "OK" }
duration = "very fast"
blocking = true
ex_command = "`clear`"
ex_return = "`CLEAR,OK`"

["file"]
description = "Show informations about a file"
args = { "file" = "str" }
returns = { "FILE" = "str" }
duration = "normal"
blocking = true
ex_command = "`file /sd/hello.txt`"
ex_return = "`FILE,text-file,LE"

["ls"]
description = "List files on the current directory"
args = {}
returns = { "LS" = "..." }
duration = "normal"
blocking = true
ex_command = "`ls`"
ex_return = "`LS,hello.txt`"

["mkdir"]
description = "Create a directory on the current location"
args = { "NAME" = "str" }
returns = { "MKDIR" = "OK" }
duration = "fast"
blocking = true
ex_command = "`mkdir /sd/test/`"
ex_return = "`MKDIR,OK`"

["mv"]
description = "Move a file from a location to another one"
args = { "SOURCE" = "str", "TARGET" = "str" }
returns = { "MV" = "OK" }
duration = "slow"
blocking = true
ex_command = "`mv /sd/hello.txt /sd/hello2.txt`"
ex_return = "`MV,OK`"

["cp"]
description = "Copy a file from a location to another one"
args = { "SOURCE" = "str", "TARGET" = "str" }
returns = { "CP" = "OK" }
duration = "slow"
blocking = true
ex_command = "`cp /sd/hello.txt /sd/hello2.txt`"
ex_return = "`CP,OK`"

["pwd"]
description = "Print the current location on the filesystem"
args = {}
returns = { "PWD" = "str" }
duration = "normal"
blocking = true
ex_command = "`PWD`"
ex_return = "`PWD,/sd/example/`"
